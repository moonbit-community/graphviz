<title>struct3</title>
<polygon fill="none" stroke="black" points="89.88,-0.5 89.88,-1356 631.88,-1356 631.88,-0.5 89.88,-0.5"/>
<text xml:space="preserve" text-anchor="middle" x="113.62" y="-689.7" font-family="Times,serif" font-size="14.00">hello</text>
<text xml:space="preserve" text-anchor="middle" x="113.62" y="-673.2" font-family="Times,serif" font-size="14.00">world</text>
<text xml:space="preserve" text-anchor="middle" x="113.62" y="-656.7" font-family="Times,serif" font-size="14.00">and</text>
<polyline fill="none" stroke="black" points="137.38,-0.5 137.38,-1356"/>
<text xml:space="preserve" text-anchor="middle" x="191.5" y="-1125.2" font-family="Times,serif" font-size="14.00">Thats the reason</text>
<polyline fill="none" stroke="black" points="137.38,-904.5 245.62,-904.5"/>
<text xml:space="preserve" text-anchor="middle" x="191.5" y="-673.7" font-family="Times,serif" font-size="14.00">post&#45;menopausal</text>
<polyline fill="none" stroke="black" points="137.38,-453 245.62,-453"/>
<text xml:space="preserve" text-anchor="middle" x="191.5" y="-221.7" font-family="Times,serif" font-size="14.00">estrogen</text>
<polyline fill="none" stroke="black" points="245.62,-0.5 245.62,-1356"/>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1338.7" font-family="Times,serif" font-size="14.00">is</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1322.2" font-family="Times,serif" font-size="14.00">given together with another hormone called</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1305.7" font-family="Times,serif" font-size="14.00">progestin: The combination lowers the risk of</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1289.2" font-family="Times,serif" font-size="14.00">endometrial cancer.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1256.7" font-family="Times,serif" font-size="14.00">But the NTP advisers said putting all</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1240.2" font-family="Times,serif" font-size="14.00">estrogens on the federal list would help</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1223.7" font-family="Times,serif" font-size="14.00">women trying to balance the benefits and</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1207.2" font-family="Times,serif" font-size="14.00">risks when choosing hormone therapy.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1190.7" font-family="Times,serif" font-size="14.00">Physicians never discuss any of these risks</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1174.2" font-family="Times,serif" font-size="14.00">when they are prescribing hormone therapy.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1157.7" font-family="Times,serif" font-size="14.00">They only discuss benefits. Listing might</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1141.2" font-family="Times,serif" font-size="14.00">force it on the table, Michelle Medinsky, a</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1124.7" font-family="Times,serif" font-size="14.00">toxicologist from Durham, N.C., said before</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1108.2" font-family="Times,serif" font-size="14.00">the vote.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1075.7" font-family="Times,serif" font-size="14.00">The committee of scientists advises the NTP,</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1059.2" font-family="Times,serif" font-size="14.00">a branch of the National Institutes of Health</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1042.7" font-family="Times,serif" font-size="14.00">that every two years updates the federal list</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1026.2" font-family="Times,serif" font-size="14.00">of proven and suspected cancer&#45;causing</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-1009.7" font-family="Times,serif" font-size="14.00">substances.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-977.2" font-family="Times,serif" font-size="14.00">The NTP typically follows its advisers</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-960.7" font-family="Times,serif" font-size="14.00">recommendations, but an officially updated</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-944.2" font-family="Times,serif" font-size="14.00">carcinogen list isnt expected until 2002.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-911.7" font-family="Times,serif" font-size="14.00">Thursday, after a daylong debate, the panel</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-895.2" font-family="Times,serif" font-size="14.00">declined to add talc powder to the list,</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-878.7" font-family="Times,serif" font-size="14.00">saying there wasnt enough evidence linking</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-862.2" font-family="Times,serif" font-size="14.00">its use in feminine hygiene products to</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-845.7" font-family="Times,serif" font-size="14.00">ovarian cancer. The panel deadlocked over</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-829.2" font-family="Times,serif" font-size="14.00">whether to a second type of talc, fibrous</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-812.7" font-family="Times,serif" font-size="14.00">talc that some studies have linked to lung</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-796.2" font-family="Times,serif" font-size="14.00">cancer in talc miners.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-763.7" font-family="Times,serif" font-size="14.00">On Wednesday, the panel voted to add</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-747.2" font-family="Times,serif" font-size="14.00">ultraviolet radiation &#45;&#45; those</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-730.7" font-family="Times,serif" font-size="14.00">sunburn&#45;causing rays long known to cause skin</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-714.2" font-family="Times,serif" font-size="14.00">cancer &#45;&#45; to the official carcinogen list.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-681.7" font-family="Times,serif" font-size="14.00">The panel on Friday continued debating an</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-665.2" font-family="Times,serif" font-size="14.00">association between cancers of the nose and</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-648.7" font-family="Times,serif" font-size="14.00">sinuses with industrial exposure to wood</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-632.2" font-family="Times,serif" font-size="14.00">dust.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-599.7" font-family="Times,serif" font-size="14.00">Talc has long been controversial. When</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-583.2" font-family="Times,serif" font-size="14.00">studies first appeared suggesting it migrated</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-566.7" font-family="Times,serif" font-size="14.00">into the ovaries to cause tumors, many</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-550.2" font-family="Times,serif" font-size="14.00">feminine hygiene products replaced talc with</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-533.7" font-family="Times,serif" font-size="14.00">cornstarch.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-501.2" font-family="Times,serif" font-size="14.00">Panelist Medinsky said she had been prepared</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-484.7" font-family="Times,serif" font-size="14.00">to list talc powder as reasonably believed</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-468.2" font-family="Times,serif" font-size="14.00">to cause cancer. But after listening to</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-451.7" font-family="Times,serif" font-size="14.00">hours of industry attacks on the science,</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-435.2" font-family="Times,serif" font-size="14.00">the evidence has knocked me out of the</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-418.7" font-family="Times,serif" font-size="14.00">reasonably category into not list, she</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-402.2" font-family="Times,serif" font-size="14.00">said before the panel voted 7&#45;3 against</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-385.7" font-family="Times,serif" font-size="14.00">listing talc.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-353.2" font-family="Times,serif" font-size="14.00">Talc has long been controversial. When</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-336.7" font-family="Times,serif" font-size="14.00">studies first appeared suggesting it migrated</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-320.2" font-family="Times,serif" font-size="14.00">into the ovaries to cause tumors, many</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-303.7" font-family="Times,serif" font-size="14.00">feminine hygiene products replaced talc with</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-287.2" font-family="Times,serif" font-size="14.00">cornstarch.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-254.7" font-family="Times,serif" font-size="14.00">Panelist Medinsky said she had been prepared</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-238.2" font-family="Times,serif" font-size="14.00">to list talc powder as reasonably believed</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-221.7" font-family="Times,serif" font-size="14.00">to cause cancer. But after listening to</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-205.2" font-family="Times,serif" font-size="14.00">hours of industry attacks on the science,</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-188.7" font-family="Times,serif" font-size="14.00">the evidence has knocked me out of the</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-172.2" font-family="Times,serif" font-size="14.00">reasonably category into not list, she</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-155.7" font-family="Times,serif" font-size="14.00">said before the panel voted 7&#45;3 against</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-139.2" font-family="Times,serif" font-size="14.00">listing talc.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-106.7" font-family="Times,serif" font-size="14.00">Talc in one form or the other can be found in</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-90.2" font-family="Times,serif" font-size="14.00">many papers, paints, ceramics, food wrappers,</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-73.7" font-family="Times,serif" font-size="14.00">hard candy, chewing gum, cosmetics and pills.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-57.2" font-family="Times,serif" font-size="14.00">Most people are familiar with talc as a loose</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-40.7" font-family="Times,serif" font-size="14.00">powder used in cosmetics and as a drying</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-24.2" font-family="Times,serif" font-size="14.00">powder.</text>
<text xml:space="preserve" text-anchor="middle" x="382.62" y="-7.7" font-family="Times,serif" font-size="14.00">abde</text>
<polyline fill="none" stroke="black" points="519.62,-0.5 519.62,-1356"/>
